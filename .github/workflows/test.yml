name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: mimir-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No dependencies to install: the tests use what Node brings.
      - name: Run the tests
        run: node --test
